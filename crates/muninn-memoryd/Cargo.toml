[package]
name = "muninn-memoryd"
version.workspace = true
edition = "2024"

[dependencies]
muninn-core = { version = "0.1.0", path = "../muninn-core" }
axum = "0.8.9"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
ureq = { version = "3.4.2", features = ["json"] }

[[bin]]
name = "muninn-memoryd"
path = "src/main.rs"
