[package]
name = "muninn-indexd"
version.workspace = true
edition = "2024"

[dependencies]
muninn-core = { version = "0.1.0", path = "../muninn-core" }
axum = "0.8.9"
hex = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
ureq = "3.4.2"
